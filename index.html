ation":"","id":4},{"question":"Налоговый консультант предлагает искусственно разделить одну хозяйственную операцию между несколькими компаниями исключительно для сокрытия налоговой базы. Как следует оценить такую схему?","options":["Это всегда законная оптимизация","Это стандартная налоговая льгота","Она создает существенные налоговые и правовые риски","Это обязательная процедура отчетности","Это форма камерального контроля"],"answer":2,"source":"highlighted-key","topic":"Налоговая система","explanation":"","id":5},{"question":"Налоговый консультант получил конфиденциальные сведения о бизнесе клиента. Какой профессиональный принцип имеет первостепенное значение?","options":["Максимизация публичности","Раскрытие информации конкурентам","Конфиденциальность","Игнорирование законодательства","Использование сведений для личной выгоды"],"answer":2,"source":"highlighted-key","topic":"Налоговая система","explanation":"","id":6},{"question":"Налоговый орган получает сведения о финансовой деятельности налогоплательщика при исполнении своих полномочий. Как должен обращаться с такой информацией налоговый орган?","options":["Публиковать всю информацию","Передавать конкурентам","Обеспечивать установленный законом режим конфиденциальности","Использовать для личных целей","Передавать любому гражданину"],"answer":2,"source":"highlighted-key","topic":"Налоговое администрирование","explanation":"","id":7},{"question":"Налогоплательщик хочет оспорить решение налогового органа, поскольку считает его нарушающим его права. Какой механизм должен использоваться?","options":["Самовольная отмена решения","Установленный законодательством порядок обжалования","Отказ от налогового учета","Сокрытие имущества","Прекращение подачи отчетности"],"answer":1,"source":"highlighted-key","topic":"Налоговое администрирование","explanation":"","id":8},{"question":"Компания создает внутреннюю систему, которая ежемесячно сопоставляет данные бухгалтерского и налогового учета. Какова основная цель?","options":[     function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
    function shuffle(list) { const a = [...list]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
    function qState(q) { return state.byId[q.id] || (state.byId[q.id] = emptyQuestionState()); }
    function typeOf(q) { return /\d{2,}|рассчита|определите сумму|какова сумма|сколько тенге|объем двигателя|объём двигателя|ставка акциза|сумм[ау] налога/i.test(q.question) ? "practice" : "theory"; }
    function wrongQuestions() { return QUESTIONS.filter(q => qState(q).pending); }
    function totals() {
      let seen=0,correct=0,wrong=0;
      for(const q of QUESTIONS){const s=qState(q);seen+=s.seen;correct+=s.correct;wrong+=s.wrong}
      return {seen,correct,wrong,accuracy:seen?Math.round(correct/seen*100):0,pending:wrongQuestions().length};
    }
    function topicStats(topic) {
      const list=QUESTIONS.filter(q=>q.topic===topic);let seen=0,correct=0;
      for(const q of list){const s=qState(q);seen+=s.seen;correct+=s.correct}
      return {total:list.length,seen,correct,accuracy:seen?Math.round(correct/seen*100):0};
    }
    function toast(message) { const old=document.querySelector(".toast");if(old)old.remove();const el=document.createElement("div");el.className="toast";el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),1800); }
    function iconForTopic(i){return topicEmojis[i%topicEmojis.length]}
    function storageLabel(){return storageMode==="telegram"?"Прогресс синхронизируется через Telegram":storageMode==="device"?"Прогресс сохранён на этом устройстве":"Прогресс сохраняется в браузере"}
    function subjectPicker(){
      currentView="subjects";
      if(TelegramApp?.BackButton)TelegramApp.BackButton.hide();
      const countTopics=bank=>new Set(bank.questions.map(q=>q.topic)).size;
      const tax=BANKS.tax,investment=BANKS.investment;
      app.innerHTML=`<header class="brandbar"><div class="mark">📚</div><div class="brand"><strong>Учебный тренажёр</strong><small>Выбери предмет и продолжай подготовку</small></div></header><section class="view"><section class="hero"><div class="eyebrow">Тесты · практика · разбор ошибок</div><h1>Выбери предмет</h1><p>У каждого предмета свои вопросы, темы, статистика и список ошибок.</p></section><div class="subject-grid"><button class="subject-card" onclick="selectSubject('tax')"><div class="subject-card-top"><span class="subject-mark">₸</span><span class="badge green">${fmt(tax.questions.length)} вопросов</span></div><h2>${esc(tax.title)}</h2><p>${esc(tax.description)}</p><div class="subject-card-bottom"><span>${countTopics(tax)} тем · свой прогресс</span><b>Открыть →</b></div></button><button class="subject-card" onclick="selectSubject('investment')"><div class="subject-card-top"><span class="subject-mark">📈</span><span class="badge purple">${fmt(investment.questions.length)} вопросов</span></div><h2>${esc(investment.title)}</h2><p>${esc(investment.description)}</p><div class="subject-card-bottom"><span>${countTopics(investment)} тем · свой прогресс</span><b>Открыть →</b></div></button></div><p class="footnote">Прогресс по предметам хранится отдельно в вашем Telegram.</p></section>`;
    }
    function showSubjects(){
      if(quiz){if(!confirm("Закончить текущую попытку и вернуться к выбору предмета? Проверенные ответы сохранятся."))return;finishQuiz(true)}
      subjectPicker();
    }
    async function selectSubject(id){
      if(!BANKS[id])return;
      if(quiz){if(!confirm("Закончить текущую попытку? Проверенные ответы сохранятся."))return;finishQuiz(true)}
      activeSubject=id;QUESTIONS=BANKS[id].questions;topics=[...new Set(QUESTIONS.map(q=>q.topic))];
      state={byId:{},runs:0,completed:0};for(const q of QUESTIONS)state.byId[q.id]=emptyQuestionState();
      listFilter="";searchValue="";storageMode="local";currentView="topics";

    }
    function shell(content){
      const t=totals(),subject=BANKS[activeSubject];
      app.innerHTML=`<header class="brandbar"><div class="mark">${subject.icon}</div><div class="brand"><strong>${esc(subject.title)} · тренажёр</strong><small>${topics.length} тем · ${fmt(QUESTIONS.length)} вопросов</small></div><div class="brand-end"><button class="subject-switch" onclick="showSubjects()">↗ Предметы</button><br><b>${t.accuracy}%</b><br>верно</div></header><nav class="tabs" aria-label="Разделы"><button class="tab ${currentView==='topics'?'active':''}" onclick="go('topics')">▦ Темы <span class="count">${topics.length}</span></button><button class="tab ${currentView==='test'?'active':''}" onclick="go('test')">☑ Тест <span class="count">${fmt(QUESTIONS.length)}</span></button><button class="tab ${currentView==='cards'?'active':''}" onclick="go('cards')">▤ Карточки <span class="count">${fmt(QUESTIONS.length)}</span></button><button class="tab ${currentView==='all'?'active':''}" onclick="go('all')">⌕ Все вопросы <span class="count">${fmt(QUESTIONS.length)}</span></button></nav><section class="view">${content}</section>`;
    }
    function home(){
      currentView="topics";quiz=null;stopTimer();if(TelegramApp?.BackButton)TelegramApp.BackButton.hide();
      const t=totals(),subject=BANKS[activeSubject];
      const topicTiles=topics.map((topic,i)=>{const s=topicStats(topic);return `<button class="tile tile-button" onclick='startQuiz({topic:${JSON.stringify(topic)},count:15,mode:"practice"})'><div class="tile-top"><span class="tile-icon">${iconForTopic(i)}</span><span class="badge ${i%3===0?'green':i%3===1?'orange':'purple'}">${fmt(s.total)} вопросов</span></div><h3>${esc(topic)}</h3><p>${s.seen?`${s.correct}/${s.seen} верно · ${s.accuracy}%`:'Начни с вопросов по теме'}</p></button>`}).join("");
      const theoryCount=QUESTIONS.filter(q=>typeOf(q)==="theory").length,practiceCount=QUESTIONS.length-theoryCount;
      let studyTiles="";
      if(theoryCount)studyTiles+=`<button class="tile tile-button" onclick='startQuiz({kind:"theory",count:20,mode:"practice"})'><div class="tile-top"><span class="tile-icon">📘</span><span class="badge">${theoryCount} вопросов</span></div><h3>${activeSubject==="tax"?"Теоретические вопросы":"Вопросы по темам"}</h3><p>Тренировка по понятиям и ключевым темам предмета.</p></button>`;
      if(practiceCount)studyTiles+=`<button class="tile tile-button" onclick='startQuiz({kind:"practice",count:20,mode:"practice"})'><div class="tile-top"><span class="tile-icon">🧮</span><span class="badge orange">${practiceCount} вопросов</span></div><h3>Практические задачи</h3><p>Расчёты и применение правил на примерах.</p></button>`;
      studyTiles+=`<button class="tile tile-button" onclick='startQuiz({count:25,mode:"exam",minutes:30})'><div class="tile-top"><span class="tile-icon">🎓</span><span class="badge green">25 вопросов · 30 мин</span></div><h3>Экзамен</h3><p>Контрольный режим с таймером и проверкой ответов в конце.</p></button><button class="tile tile-button" onclick="startErrors()"><div class="tile-top"><span class="tile-icon">🔥</span><span class="badge red">${t.pending} ошибок</span></div><h3>Работа над ошибками</h3><p>Повторяй только вопросы, где ошибся. Верный ответ убирает их из списка.</p></button>`;
      shell(`<section class="hero"><div class="eyebrow">Вопросы · практика · разбор ошибок</div><h1>Подготовка: ${esc(subject.title)}</h1><p>${esc(subject.description)} Прогресс и ошибки сохраняются отдельно для этого предмета.</p><div class="hero-actions"><button class="btn" onclick="go('stats')">Мой прогресс · ${t.accuracy}%</button><button class="btn primary" onclick='startQuiz({count:15,mode:"practice"})'>⚡ Быстрый тест · 15 вопросов</button></div></section><div class="stats"><div class="metric"><strong>${fmt(QUESTIONS.length)}</strong><span>вопросов в базе</span></div><div class="metric"><strong>${t.pending}</strong><span>ошибок на повтор</span></div><div class="metric"><strong>${state.completed}</strong><span>завершённых тестов</span></div></div><div class="grid">${studyTiles}</div><div class="section-head"><div><h2>Темы курса (${topics.length})</h2><p>Нажми на тему, чтобы запустить тренировку.</p></div><button class="linkbtn" onclick="go('all')">Все вопросы →</button></div><div class="topic-list">${topicTiles}</div><div class="section-head"><div><h2>Настроить тест</h2><p>Выбери тему, тип заданий и количество.</p></div></div>${filterForm()}<p class="footnote">${esc(storageLabel())} · личные данные не видны другим участникам</p>`);
    }
    function filterForm(){
      const hasPractice=QUESTIONS.some(q=>typeOf(q)==="practice");
      const kindOptions=hasPractice?'<option value="all">Теория + практика</option><option value="theory">Теория</option><option value="practice">Практика</option>':'<option value="all">Все вопросы</option><option value="theory">Теория</option>';
      return `<div class="filterbox"><div class="field"><label for="filter-topic">Тема курса</label><select id="filter-topic"><option value="all">Все темы (${QUESTIONS.length})</option>${topics.map(t=>`<option value="${esc(t)}">${esc(t)} (${QUESTIONS.filter(q=>q.topic===t).length})</option>`).join("")}</select></div><div class="field"><label for="filter-kind">Тип вопросов</label><select id="filter-kind">${kindOptions}</select></div><div class="field"><label for="filter-count">Количество</label><select id="filter-count"><option value="15">15 вопросов</option><option value="20">20 вопросов</option><option value="25">25 вопросов</option><option value="50">50 вопросов</option><option value="all">Вся выбранная база</option></select></div><div class="startrow"><button class="btn primary" onclick="startFiltered()">Начать тест →</button></div></div>`
    }
    function startFiltered(){const topic=document.getElementById("filter-topic")?.value||"all",kind=document.getElementById("filter-kind")?.value||"all",count=document.getElementById("filter-count")?.value||"15";startQuiz({topic:topic==="all"?"":topic,kind,count:count==="all"?Infinity:Number(count),mode:"practice"})}
    function go(view){
      if(view==="subjects"){showSubjects();return}
      if(quiz&&view==="test"){renderQuizQuestion();return}
      if(quiz&&view!=="test"&&!confirm("Выйти из текущей попытки? Уже проверенные ответы сохранены."))return;
      currentView=view;quiz=null;cardState=null;stopTimer();
      if(TelegramApp?.BackButton){if(view==="topics")TelegramApp.BackButton.hide();else TelegramApp.BackButton.show()}
      render();
    }
    function backToTopics(){
      if(currentView==="subjects")return;
      if(currentView==="topics"){subjectPicker();return}
      if(quiz){if(!confirm("Закончить текущую попытку? Проверенные ответы сохранятся."))return;finishQuiz(true)}
      home();
    }
    function render(){if(currentView==="subjects")subjectPicker();else if(currentView==="topics")home();else if(currentView==="test")testSetup();else if(currentView==="cards")cardsHome();else if(currentView==="all")allQuestions();else if(currentView==="errors")errorsHome();else if(currentView==="stats")statsPage();else if(currentView==="question")questionPage()}
    function testSetup(){const t=totals();shell(`<section class="hero"><div class="eyebrow">Тестирование</div><h1>Выбери режим</h1><p>Короткая тренировка сразу покажет ответ. Экзамен проверит результат в конце.</p><div class="hero-actions"><button class="btn primary" onclick='startQuiz({count:15,mode:"practice"})'>⚡ Быстрый тест · 15 вопросов</button><button class="btn" onclick='startQuiz({count:25,mode:"exam",minutes:30})'>🎓 Экзамен · 25 вопросов</button></div></section><div class="stats"><div class="metric"><strong>${t.accuracy}%</strong><span>точность</span></div><div class="metric"><strong>${t.seen}</strong><span>ответов</span></div><div class="metric"><strong>${t.pending}</strong><span>ошибок</span></div></div><div class="section-head"><div><h2>Настроить тест</h2><p>Можно выбрать тему и тип вопросов.</p></div></div>${filterForm()}`)}
    function startQuiz({topic="",kind="all",count=15,mode="practice",minutes=0,errorsOnly=false,specific=null}={}){
      let pool=QUESTIONS.filter(q=>(!topic||q.topic===topic)&&(kind==="all"||typeOf(q)===kind)&&(!errorsOnly||qState(q).pending)&&(!specific||q.id===specific));
      if(!pool.length){toast(errorsOnly?"Пока нет ошибок для повтора":"Для выбранных фильтров нет вопросов");return}
      const unseen=shuffle(pool.filter(q=>qState(q).seen===0));
      const seen=shuffle(pool.filter(q=>qState(q).seen>0)).sort((a,b)=>qState(a).seen-qState(b).seen);
      let ordered=unseen.concat(seen);
      const size=Number.isFinite(count)?Math.min(count,pool.length):pool.length;
      if(errorsOnly)ordered=shuffle(pool);
      const questions=ordered.slice(0,size);
      if(!questions.length){toast("Нет вопросов для запуска");return}
      state.runs++;saveMeta();
      quiz={questions,topic,mode,minutes,remaining:minutes*60,pos:0,answers:[],selected:null,revealed:false,errorsOnly,closed:false};
      currentView="test";if(minutes)startTimer();renderQuizQuestion();
    }
    function startErrors(){const pending=wrongQuestions();if(!pending.length){toast("Ошибок для повторения пока нет");return}startQuiz({count:pending.length,mode:"practice",errorsOnly:true})}
    function startTimer(){stopTimer();timerHandle=setInterval(()=>{if(!quiz)return;quiz.remaining--;const el=document.getElementById("timer");if(el)el.textContent=timeText(quiz.remaining);if(quiz.remaining<=0)finishQuiz(true)},1000)}
    function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}}
    function timeText(seconds){const n=Math.max(0,seconds|0);return `${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`}
    function renderQuizQuestion(){
      if(!quiz)return;const q=quiz.questions[quiz.pos],n=quiz.questions.length,p=quiz.pos+1,exam=quiz.mode==="exam";
      const prefix=quiz.errorsOnly?"Работа над ошибками":(quiz.topic||q.topic);
      const answerButtons=q.options.map((option,i)=>{let cls="answer";if(quiz.selected===i)cls+=" selected";if(quiz.revealed){if(i===q.answer)cls+=" correct";else if(i===quiz.selected)cls+=" wrong"}return `<button class="answer ${cls}" ${quiz.revealed?"disabled":""} onclick="chooseAnswer(${i})"><span class="letter">${LETTERS[i]}</span><span>${esc(option)}</span></button>`}).join("");
      let feedback="";if(quiz.revealed){const ok=quiz.selected===q.answer;feedback=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ Верно':'× Ошибка'}</b>${ok?'':'Правильный ответ: '+LETTERS[q.answer]+'. '+esc(q.options[q.answer])}${q.explanation?'<br><br>'+esc(q.explanation):''}</div>`}
      shell(`<div class="progress-head"><span>${esc(prefix)} · ${p} из ${n}</span>${exam?`<b class="timer" id="timer">${timeText(quiz.remaining)}</b>`:`<span>${Math.round((p-1)/n*100)}%</span>`}</div><div class="progress-track"><div class="progress-fill" style="width:${Math.round((p-1)/n*100)}%"></div></div><article class="panel"><p class="eyebrow">${esc(q.topic)}</p><div class="question-text">${esc(q.question)}</div><div class="answers">${answerButtons}</div>${feedback}<div class="quiz-actions">${quiz.revealed?`<button class="btn primary full" onclick="nextQuizQuestion()">${p===n?'Завершить тест':'Следующий вопрос →'}</button>`:exam?`<button class="btn full" onclick="nextExamQuestion()" ${quiz.selected===null?'disabled':''}>${p===n?'Завершить экзамен':'Дальше →'}</button>`:`<button class="btn full" onclick="finishQuiz(true)">Завершить тест</button>`}</div></article><button class="btn full" onclick="confirmCloseQuiz()">Свернуть тест и вернуться</button>`);
    }
    function chooseAnswer(index){if(!quiz||quiz.revealed)return;quiz.selected=index;if(quiz.mode==="exam"){renderQuizQuestion();return}const q=quiz.questions[quiz.pos];quiz.answers[quiz.pos]=index;quiz.revealed=true;recordAnswer(q,index===q.answer);renderQuizQuestion();if(TelegramApp?.HapticFeedback)TelegramApp.HapticFeedback.notificationOccurred(index===q.answer?"success":"error")}
    function recordAnswer(q,ok){const s=qState(q);s.seen++;s.last=Date.now();if(ok){s.correct++;s.pending=false}else{s.wrong++;s.pending=true}saveQuestion(q)}
    function nextQuizQuestion(){if(!quiz)return;if(quiz.pos+1>=quiz.questions.length){finishQuiz(false);return}quiz.pos++;quiz.selected=null;quiz.revealed=false;renderQuizQuestion()}
    function nextExamQuestion(){if(!quiz)return;quiz.answers[quiz.pos]=quiz.selected;if(quiz.pos+1>=quiz.questions.length){finishQuiz(false);return}quiz.pos++;quiz.selected=null;renderQuizQuestion()}
    function confirmCloseQuiz(){if(quiz&&confirm("Завершить эту попытку? Проверенные ответы сохраняются.")){finishQuiz(true)}}
    function finishQuiz(interrupted){if(!quiz)return;stopTimer();if(quiz.mode==="exam"){for(let i=0;i<quiz.questions.length;i++){const q=quiz.questions[i],choice=quiz.answers[i]??(i===quiz.pos?quiz.selected:null);quiz.answers[i]=choice;if(choice!==null&&choice!==undefined)recordAnswer(q,choice===q.answer)}}let score=0;const review=[];for(let i=0;i<quiz.questions.length;i++){const q=quiz.questions[i],choice=quiz.answers[i];if(choice===q.answer)score++;if(choice!==null&&choice!==undefined&&choice!==q.answer)review.push(q)}state.completed++;saveMeta();const total=quiz.questions.length,percentage=Math.round(score/total*100);quiz=null;currentView="summary";summaryPage({score,total,percentage,interrupted,review})}
    function summaryPage(result){currentView="summary";const pct=result.percentage??(result.total?Math.round(result.score/result.total*100):0);const review=result.review||[];shell(`<section class="hero"><div class="eyebrow">${result.interrupted?'Попытка завершена':'Результат'}</div><h1>${result.score} из ${result.total}</h1><p>${pct}% правильных ответов${result.interrupted?' · незавершённые вопросы не засчитывались':''}</p><div class="hero-actions"><button class="btn primary" onclick="home()">На главную</button>${review.length?`<button class="btn danger" onclick="startErrors()">🔥 Разобрать ошибки · ${review.length}</button>`:''}</div></section><section class="panel"><h2>Ошибки этой попытки</h2><p class="panel-sub">Вопросы останутся здесь, пока не ответишь на них правильно.</p>${review.length?`<div class="question-list">${review.map(q=>`<button class="question-row" onclick="openQuestion(${q.id})"><b>${esc(q.question)}</b><span>${esc(q.topic)} · повторить →</span></button>`).join('')}</div>`:`<div class="empty"><strong>Отлично, ошибок нет</strong>Пока нечего повторять.</div>`}</section>`)}
    function errorsHome(){currentView="errors";const list=wrongQuestions();shell(`<section class="hero"><div class="eyebrow">Повторение</div><h1>Работа над ошибками</h1><p>Здесь только вопросы, в которых ты ошибался. Правильный ответ убирает вопрос из списка.</p><div class="hero-actions"><button class="btn danger" onclick="startErrors()" ${list.length?'':'disabled'}>🔥 Начать повтор · ${list.length}</button></div></section>${list.length?`<div class="question-list">${list.map(q=>`<button class="question-row" onclick="openQuestion(${q.id})"><b>${esc(q.question)}</b><span>${esc(q.topic)} · ${qState(q).wrong} ошибок · открыть →</span></button>`).join('')}</div>`:`<div class="empty"><strong>Ошибок пока нет</strong>После теста все неверные ответы появятся здесь.</div>`}`)}
    function cardsHome(){currentView="cards";const list=shuffle(QUESTIONS);cardState={list,pos:0,revealed:false};showCard()}
    function showCard(){if(!cardState)return;const q=cardState.list[cardState.pos];shell(`<div class="progress-head"><span>Карточки · ${cardState.pos+1} из ${cardState.list.length}</span><button class="linkbtn" onclick="home()">Закрыть</button></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(cardState.pos/cardState.list.length*100)}%"></div></div><article class="panel"><p class="eyebrow">${esc(q.topic)}</p><div class="question-text">${esc(q.question)}</div>${cardState.revealed?`<div class="feedback good"><b>Правильный ответ</b>${LETTERS[q.answer]}. ${esc(q.options[q.answer])}</div><div class="quiz-actions"><button class="btn danger" onclick="markCard(${q.id},false)">Не знаю · в ошибки</button><button class="btn primary" onclick="markCard(${q.id},true)">Знаю · дальше</button></div>`:`<button class="btn primary full" onclick="revealCard()">Показать ответ</button>`}</article>`)}
    function revealCard(){cardState.revealed=true;showCard()}
    function markCard(id,know){const q=QUESTIONS.find(x=>x.id===id);recordAnswer(q,know);if(cardState.pos+1>=cardState.list.length){cardState=null;home();toast("Карточки закончились");return}cardState.pos++;cardState.revealed=false;showCard()}
    function allQuestions(){currentView="all";const list=QUESTIONS.filter(q=>(!listFilter||q.topic===listFilter)&&(!searchValue||q.question.toLowerCase().includes(searchValue.toLowerCase())));shell(`<section class="section-head" style="margin-top:0"><div><h2>Все вопросы</h2><p>${list.length} из ${QUESTIONS.length} · открой, чтобы посмотреть варианты.</p></div><button class="linkbtn" onclick="go('stats')">Статистика →</button></section><input class="search" placeholder="Поиск по вопросу" value="${esc(searchValue)}" oninput="setSearch(this.value)"><div class="field" style="margin-bottom:10px"><select onchange="setListFilter(this.value)"><option value="">Все темы (${QUESTIONS.length})</option>${topics.map(t=>`<option value="${esc(t)}" ${listFilter===t?'selected':''}>${esc(t)} (${QUESTIONS.filter(q=>q.topic===t).length})</option>`).join('')}</select></div><div class="question-list">${list.map(q=>`<button class="question-row" onclick="openQuestion(${q.id})"><b>${esc(q.question)}</b><span>${esc(q.topic)} · ${qState(q).pending?'🔥 ошибка · ':''}открыть →</span></button>`).join('')||'<div class="empty"><strong>Ничего не нашлось</strong>Попробуй изменить поиск.</div>'}</div>`)}
    function setSearch(value){searchValue=value;const y=window.scrollY;allQuestions();window.scrollTo(0,y);const input=document.querySelector('.search');if(input){input.focus();input.setSelectionRange(value.length,value.length)}}
    function setListFilter(value){listFilter=value;allQuestions()}
    function openQuestion(id){const q=QUESTIONS.find(x=>x.id===id);if(!q)return;currentView="question";shell(`<button class="linkbtn" onclick="go('all')">← К списку</button><article class="question-detail"><p class="eyebrow">${esc(q.topic)}</p><h3>${esc(q.question)}</h3>${q.options.map((o,i)=>`<div class="answer ${i===q.answer?'correct':''}"><span class="letter">${LETTERS[i]}</span><span>${esc(o)}</span></div>`).join('')}<div class="separator"></div><button class="btn primary full" onclick='startQuiz({topic:${JSON.stringify(q.topic)},count:1,mode:"practice",specific:${q.id}})'>Потренировать вопрос</button></article>`)}
    function statsPage(){currentView="stats";const t=totals();const rows=topics.map(topic=>{const s=topicStats(topic);return `<div class="barrow"><b>${esc(topic)}</b><span>${s.correct}/${s.seen} · ${s.accuracy}%</span><div class="bar"><i style="width:${s.accuracy}%"></i></div></div>`}).join('');shell(`<section class="hero"><div class="eyebrow">Твой прогресс</div><h1>${t.accuracy}% правильных ответов</h1><p>${t.correct} верно из ${t.seen} · ${state.completed} завершённых тестов · ${t.pending} ошибок на повтор.</p><div class="hero-actions"><button class="btn danger" onclick="startErrors()">🔥 Разобрать ошибки</button><button class="btn" onclick="confirmReset()">Сбросить мой прогресс</button></div></section><section class="panel"><h2>Результаты по темам</h2><p class="panel-sub">Считаются ответы на тестах и карточках.</p><div class="bars">${rows}</div></section><p class="footnote">${esc(storageLabel())}. История личная и видна только тебе.</p>`)}
    async function confirmReset(){if(!confirm("Удалить личную статистику и список ошибок?"))return;const keys=[metaKey(),...QUESTIONS.map(q=>stateKey(q.id))];try{if(storageMode==="telegram")await tgCall("removeItems",keys);else keys.forEach(k=>localStorage.removeItem(k))}catch{}state={byId:{},runs:0,completed:0};for(const q of QUESTIONS)state.byId[q.id]=emptyQuestionState();home();toast("Прогресс сброшен")}
    function initTelegram(){if(!TelegramApp)return;try{TelegramApp.ready();TelegramApp.expand();TelegramApp.setHeaderColor("#0b1019");TelegramApp.setBackgroundColor("#0b1019");TelegramApp.BackButton.onClick(backToTopics)}catch{}}
    async function boot(){initTelegram();subjectPicker()}
    window.go=go;window.selectSubject=selectSubject;window.showSubjects=showSubjects;window.startQuiz=startQuiz;window.startErrors=startErrors;window.startFiltered=startFiltered;window.chooseAnswer=chooseAnswer;window.nextQuizQuestion=nextQuizQuestion;window.nextExamQuestion=nextExamQuestion;window.finishQuiz=finishQuiz;window.confirmCloseQuiz=confirmCloseQuiz;window.revealCard=revealCard;window.markCard=markCard;window.openQuestion=openQuestion;window.setSearch=setSearch;window.setListFilter=setListFilter;window.confirmReset=confirmReset;
    boot();
  </script>
</body>
</html>
